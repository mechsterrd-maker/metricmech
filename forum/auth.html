<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signing you in — MetricMech Forum</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css?v=20260809a">
<link rel="stylesheet" href="../assets/forum.css">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
</head>
<body class="mm-grid">

<div class="grid-bg"></div>

<main>
  <div class="fm-wrap" style="max-width:520px;padding-top:90px;text-align:center">
    <div class="fm-eyebrow">METRICMECH FORUM</div>
    <h1 style="font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-0.02em;margin-bottom:10px"
        id="fm-h">Signing you in…</h1>
    <p style="color:var(--ink-2);line-height:1.6" id="fm-p">One moment.</p>
    <div style="margin-top:22px"><a class="fm-btn fm-btn-ghost" href="../forum.html">Go to the forum</a></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/forum-md.js"></script>
<script src="../assets/forum.js"></script>
<script>
(function () {
  var F = window.MMForum;

  function go(url) { location.replace(url); }

  function safeReturn() {
    // Only ever return to a same-origin path we produced ourselves.
    var raw = sessionStorage.getItem('mm_forum_return');
    sessionStorage.removeItem('mm_forum_return');
    if (!raw || raw.charAt(0) !== '/' || raw.charAt(1) === '/') return '/forum';
    return raw;
  }

  (async function () {
    try {
      var user = await F.loadSession();

      if (!user) {
        // Supabase may still be exchanging the code in the URL fragment.
        await new Promise(function (r) { setTimeout(r, 900); });
        user = await F.loadSession();
      }

      if (user) {
        await F.ensureProfile();
        go(safeReturn());
        return;
      }

      document.getElementById('fm-h').textContent = 'That link did not work';
      document.getElementById('fm-p').textContent =
        'Sign-in links expire after a short while and can only be used once. Head back to the forum and request a fresh one.';
    } catch (e) {
      console.error('[forum] auth', e);
      document.getElementById('fm-h').textContent = 'Something went wrong';
      document.getElementById('fm-p').textContent = 'Head back to the forum and try signing in again.';
    }
  })();
})();
</script>
</body>
</html>
