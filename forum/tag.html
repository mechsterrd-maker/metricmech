<meta charset="UTF-8" />

<body class="mm-grid">

<div class="grid-bg"></div>
<div data-mw="notice-bar"></div>
<div data-mw="header" data-page="forum" data-prefix="/"></div>

<main>

<div class="page-header">
  <div class="breadcrumb"><a href="/">Home</a><span class="sep">/</span><a href="/forum">Forum</a><span class="sep">/</span><span id="fm-crumb">Topic</span></div>
</div>

<div class="fm-wrap">

  <div class="fm-head">
    <div class="fm-head-row">
      <div>
        <div class="fm-eyebrow">FORUM TOPIC</div>
        <h1 id="fm-tag-name">Topic</h1>
        <p id="fm-tag-desc"></p>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-end">
        <a class="fm-btn fm-btn-primary" id="fm-ask-link" href="/forum/ask">Ask in this topic</a>
        <div id="fm-user"></div>
      </div>
    </div>
  </div>

  <div class="fm-layout">
    <div>
      <div class="fm-toolbar">
        <div class="fm-seg" id="fm-sort" role="group" aria-label="Sort questions">
          <button type="button" data-sort="new" class="on">Newest</button>
          <button type="button" data-sort="active">Active</button>
          <button type="button" data-sort="top">Top</button>
        </div>
        <a class="fm-btn fm-btn-ghost" href="/forum">All topics</a>
      </div>

      <div class="fm-list" id="fm-list"><!--MM:LIST-->
        <div class="fm-skel"></div><div class="fm-skel"></div>
      <!--/MM:LIST--></div>

      <div class="fm-pager" id="fm-pager"></div>
    </div>

    <aside>
      <div class="fm-card">
        <h4>Other topics</h4>
        <div class="fm-tagrail" id="fm-tagrail"></div>
      </div>
      <div data-mw="cn-sidebar"></div>
    </aside>
  </div>

</div>

<div data-mw="cn-big"></div>

</main>

<div data-mw="footer" data-prefix="/"></div>

<script src="/site.js"></script>
<script src="/assets/mm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/forum-md.js"></script>
<script src="/assets/forum.js"></script>
<script>
(function () {
  var F = window.MMForum;
  var PAGE_SIZE = 20;

  function slugFromUrl() {
    var explicit = F.qs('t');
    if (explicit) return explicit;
    var m = location.pathname.match(/\/forum\/t\/([^\/?#]+?)(?:\.html)?$/);
    return m ? decodeURIComponent(m[1]) : null;
  }

  var tag = slugFromUrl();
  var st = { sort: 'new', page: 0 };
  var listEl = document.getElementById('fm-list');
  var pagerEl = document.getElementById('fm-pager');

  function itemHTML(r) {
    var tags = (r.tags || []).map(function (t) {
      return '<a class="fm-tag" href="/forum/t/' + encodeURIComponent(t.slug) + '">' + F.esc(t.name) + '</a>';
    }).join('');
    var answerClass = r.has_accepted ? 'solved' : (r.answer_count > 0 ? 'answered' : '');
    var answerLabel = r.has_accepted ? 'solved' : (r.answer_count === 1 ? 'answer' : 'answers');
    return '<article class="fm-item">' +
      '<div class="fm-stats">' +
        '<div class="fm-stat"><b>' + r.vote_score + '</b>' + (Math.abs(r.vote_score) === 1 ? 'vote' : 'votes') + '</div>' +
        '<div class="fm-stat ' + answerClass + '"><b>' + r.answer_count + '</b>' + answerLabel + '</div>' +
        '<div class="fm-stat"><b>' + r.view_count + '</b>views</div>' +
      '</div>' +
      '<div>' +
        '<h3><a href="/forum/q/' + encodeURIComponent(r.slug) + '">' + F.esc(r.title) + '</a></h3>' +
        '<p class="fm-excerpt">' + F.esc(r.excerpt) + '</p>' +
        '<div class="fm-item-foot"><div class="fm-tags">' + tags + '</div>' +
          '<div class="fm-byline">' + F.avatar(r, 24) +
            '<strong>' + F.esc(r.author_name || 'Former member') + '</strong>' +
            (r.author_reputation ? '<span class="fm-rep">' + r.author_reputation + '</span>' : '') +
            '<span>· asked ' + F.timeAgo(r.created_at) + '</span></div>' +
        '</div>' +
      '</div></article>';
  }

  async function load() {
    listEl.innerHTML = '<div class="fm-skel"></div><div class="fm-skel"></div>';
    pagerEl.innerHTML = '';
    var res = await F.listQuestions({ tag: tag, sort: st.sort, page: st.page, size: PAGE_SIZE });

    listEl.innerHTML = res.rows.length ? res.rows.map(itemHTML).join('') :
      '<div class="fm-empty"><h3>Nothing here yet</h3>' +
      '<p>No questions in this topic so far. Ask the first one and it becomes the reference everyone else finds.</p>' +
      '<a class="fm-btn fm-btn-primary" href="/forum/ask?tag=' + encodeURIComponent(tag || '') + '">Ask a question</a></div>';

    var pages = Math.ceil(res.count / PAGE_SIZE);
    if (pages > 1) {
      pagerEl.innerHTML =
        '<button class="fm-btn" type="button" id="fm-prev"' + (st.page === 0 ? ' disabled' : '') + '>← Newer</button>' +
        '<span>Page ' + (st.page + 1) + ' of ' + pages + ' · ' + res.count + ' questions</span>' +
        '<button class="fm-btn" type="button" id="fm-next"' + (st.page + 1 >= pages ? ' disabled' : '') + '>Older →</button>';
      var p = document.getElementById('fm-prev'), n = document.getElementById('fm-next');
      if (p) p.onclick = function () { st.page--; load(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      if (n) n.onclick = function () { st.page++; load(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    }
  }

  (async function init() {
    if (F.offline) return;   // keep the pre-rendered list rather than blanking it
    if (!tag) { location.replace('/forum'); return; }

    document.getElementById('fm-ask-link').href = '/forum/ask?tag=' + encodeURIComponent(tag);

    document.getElementById('fm-sort').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      st.sort = b.dataset.sort; st.page = 0;
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      load();
    });

    load();

    var tags = await F.getTags();
    var me = tags.filter(function (t) { return String(t.slug).toLowerCase() === tag.toLowerCase(); })[0];
    if (me) {
      document.title = me.name + ' — Questions & Answers | MetricMech Forum';
      document.getElementById('fm-tag-name').innerHTML = F.esc(me.name);
      document.getElementById('fm-tag-desc').textContent = me.description || '';
      document.getElementById('fm-crumb').textContent = me.name;
    }
    document.getElementById('fm-tagrail').innerHTML = tags
      .filter(function (t) { return String(t.slug).toLowerCase() !== tag.toLowerCase(); })
      .map(function (t) {
        return '<a class="fm-tag" href="/forum/t/' + encodeURIComponent(t.slug) + '">' +
               F.esc(t.name) + '<span class="n">' + t.question_count + '</span></a>';
      }).join('');

    await F.loadSession();
    F.renderUserChip(document.getElementById('fm-user'));
  })();
})();
</script>
</body>
</html>
