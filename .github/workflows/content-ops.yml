# Manual content operations: keyword expansion and pillar-page builds.
name: Content Ops

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run'
        required: true
        default: 'all'
        type: choice
        options: [all, expand-keywords, build-pillars, refresh-pages]

concurrency:
  group: blog-autopilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install deps
        run: pip install pyyaml
      - name: Expand keywords
        if: inputs.task == 'expand-keywords' || inputs.task == 'all'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 content-engine/scripts/expand_keywords.py 150
      - name: Build pillar pages
        if: inputs.task == 'build-pillars' || inputs.task == 'all'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 content-engine/scripts/build_pillars.py
      - name: Refresh flagged pages
        if: inputs.task == 'refresh-pages'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 content-engine/scripts/refresh_pages.py
      - name: Commit and push
        run: |
          git config user.name "Rajadurai R"
          git config user.email "mechsterrd@gmail.com"
          git add -A
          git commit -m "Content ops: ${{ inputs.task }}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
